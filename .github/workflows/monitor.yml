name: VMware Security Advisory Monitor

on:
  schedule:
    - cron: '*/30 * * * *' # Executa a cada 30 minutos
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Restore advisory cache
        id: cache-advisory
        uses: actions/cache@v3
        with:
          path: advisory_cache.json
          key: advisory-cache-${{ github.run_id }}
          restore-keys: |
            advisory-cache-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitoring script
        run: python main.py

      - name: Save advisory cache
        if: success()
        run: |
          mkdir -p cache && cp advisory_cache.json cache/

      - name: Upload latest advisory cache artifact
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: advisory-cache-latest
          path: cache/advisory_cache.json
